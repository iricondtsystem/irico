<!doctype html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Portal &#8211; IRICO DICOM Viewer</title>
<style>
:root {
  --brand: #b8860b;
  --dark: #1c1c1c;
  --light: #f5f5f5;
  --danger: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--dark); color: #222; min-height: 100vh;
}
.topbar {
  background: var(--dark); color: #fff; padding: 14px 24px; display: flex;
  align-items: center; justify-content: space-between;
}
.topbar h1 { font-size: 18px; font-weight: 600; }
.topbar .sub { color: #bbb; font-size: 12px; }
.topbar a { color: #ddd; text-decoration: none; font-size: 13px; }
.card {
  background: #fff; max-width: 820px; margin: 32px auto; border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); overflow: hidden;
}
.card-head { padding: 20px 24px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
.card-head h2 { font-size: 16px; }
.card-body { padding: 24px; }
.msg { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: none; }
.msg.err { background: #fdecea; color: var(--danger); display: block; }
.msg.ok { background: #eafaf1; color: #1e8449; display: block; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
input[type=email], input[type=password] {
  width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 14px;
}
button {
  background: var(--brand); color: #fff; border: 0; padding: 12px 18px; border-radius: 6px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button:hover { opacity: .92; }
button.secondary { background: #555; }
button:disabled { opacity: .5; cursor: not-allowed; }
.study { border: 1px solid #e3e3e3; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.study .info strong { display: block; font-size: 15px; margin-bottom: 4px; }
.study .info span { color: #777; font-size: 12px; display: block; }
.empty { text-align: center; color: #888; padding: 30px 0; font-size: 14px; }
a.view { background: var(--brand); color: #fff; padding: 9px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
.hidden { display: none; }
footer { text-align: center; color: #666; font-size: 12px; padding: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>IRICO DICOM Viewer</h1>
    <div class="sub">Customer Portal</div>
  </div>
  <div>
    <a href="index.html">&#8592; Back to website</a>
    <span id="userbox" style="display:none;color:#bbb;margin-left:14px;"></span>
    <button id="logoutBtn" class="secondary" style="display:none;padding:6px 12px;margin-left:10px;">Log out</button>
  </div>
</div>

<div id="loginView" class="card">
  <div class="card-head"><h2>Sign in</h2></div>
  <div class="card-body">
    <div id="loginMsg" class="msg"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p style="font-size:12px;color:#888;margin-top:14px;">Access is provided by IRICO. Contact IRICO to obtain or reset your credentials.</p>
  </div>
</div>

<div id="listView" class="card hidden">
  <div class="card-head">
    <h2>Your Studies</h2>
  </div>
  <div class="card-body">
    <div id="listMsg" class="msg"></div>
    <div id="studies"></div>
    <div id="empty" class="empty hidden">No studies available yet.</div>
  </div>
</div>

<footer>Industrial Radiographic Inspection Company Private Limited</footer>

<script src="../assets/portal/lib/supabase.js"></script>
<script src="../assets/portal/portal-config.js"></script>
<script>
const SUPABASE_URL = window.PORTAL_CONFIG && window.PORTAL_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.PORTAL_CONFIG && window.PORTAL_CONFIG.SUPABASE_ANON_KEY;
const VIEWER_BASE = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.VIEWER_BASE) || '/dicom-viewer';
const TOKEN_URL = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.TOKEN_URL) || '/.netlify/functions/get-viewer-token';
const STUDY_JSON_URL = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.STUDY_JSON_URL) || '/.netlify/functions/study-json';

let sb = null;

function el(id) { return document.getElementById(id); }

async function init() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    el('loginMsg').textContent = 'Portal is not configured. Set window.PORTAL_CONFIG in portal-config.js.';
    el('loginMsg').className = 'msg err';
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if (session) { showList(session); } else { showLogin(); }
}

function showLogin() {
  el('loginView').classList.remove('hidden');
  el('listView').classList.add('hidden');
  el('logoutBtn').style.display = 'none';
  el('userbox').style.display = 'none';
}

async function showList(session) {
  el('loginView').classList.add('hidden');
  el('listView').classList.remove('hidden');
  el('logoutBtn').style.display = 'inline-block';
  el('userbox').style.display = 'inline';
  const meta = (session.user.user_metadata || session.user.app_metadata || {});
  el('userbox').textContent = (session.user.email || '');

  await loadStudies(session);
}

async function loadStudies(session) {
  const box = el('studies');
  box.innerHTML = '<div class="empty">Loading&#8230;</div>';
  el('empty').classList.add('hidden');

  const { data, error } = await sb
    .from('studies')
    .select('study_uid, patient_name, patient_id, study_date, study_description, modality, num_instances')
    .order('created_at', { ascending: false });

  if (error) {
    el('listMsg').className = 'msg err';
    el('listMsg').textContent = 'Failed to load studies: ' + error.message;
    box.innerHTML = '';
    return;
  }

  if (!data || !data.length) {
    box.innerHTML = '';
    el('empty').classList.remove('hidden');
    return;
  }

  box.innerHTML = '';
  data.forEach((s) => {
    const div = document.createElement('div');
    div.className = 'study';
    const name = s.patient_name || '(Unnamed study)';
    const date = s.study_date ? formatDate(s.study_date) : '';
    const info = [s.modality, s.study_description, `${s.num_instances} image${s.num_instances === 1 ? '' : 's'}`]
      .filter(Boolean).join(' &middot; ');
    div.innerHTML =
      '<div class="info"><strong>' + esc(name) + '</strong>' +
      '<span>' + esc(date ? date + ' &middot; ' : '') + esc(info) + '</span></div>';
    const a = document.createElement('a');
    a.className = 'view';
    a.textContent = 'Open in Viewer';
    a.href = '#';
    a.onclick = (e) => { e.preventDefault(); openStudy(s.study_uid, a); };
    div.appendChild(a);
    box.appendChild(div);
  });
}

async function openStudy(studyUid, btn) {
  btn.textContent = 'Opening&#8230;';
  const { data: { session } } = await sb.auth.getSession();
  // Token comes from the Netlify function (not a Supabase edge/functions URL),
  // so call it directly with the user's JWT.
  let resp, data;
  try {
    resp = await fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ study: studyUid }),
    });
    data = await resp.json().catch(() => ({}));
  } catch (e) {
    data = { error: e.message || 'network error' };
    resp = { ok: false };
  }
  if (!resp.ok || !data.token) {
    btn.textContent = 'Open in Viewer';
    el('listMsg').className = 'msg err';
    el('listMsg').textContent = 'Could not open study: ' + (data.error || ('HTTP ' + resp.status));
    return;
  }
  const jsonUrl = STUDY_JSON_URL + '?token=' + encodeURIComponent(data.token) +
    '&study=' + encodeURIComponent(studyUid);
  const viewerUrl = VIEWER_BASE + '/viewer/dicomjson?url=' + encodeURIComponent(jsonUrl);
  window.open(viewerUrl, '_blank');
}

function formatDate(d) {
  if (/^\d{8}$/.test(d)) {
    return d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
  }
  return d;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  el('loginMsg').className = 'msg';
  const { data, error } = await sb.auth.signInWithPassword({
    email: el('email').value.trim(),
    password: el('password').value,
  });
  if (error) {
    el('loginMsg').className = 'msg err';
    el('loginMsg').textContent = 'Sign in failed: ' + error.message;
    return;
  }
  showList(data.session);
});

el('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  showLogin();
});

init();
</script>
</body>
</html>
